<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g transform="translate(60, 10)">
    <!-- Top left horizontal bars -->
    <rect x="0" y="0" width="175" height="34" rx="4" fill="#E20A17"/>
    <rect x="0" y="46" width="175" height="34" rx="4" fill="#E20A17"/>

    <!-- Top right horizontal bars -->
    <rect x="205" y="0" width="175" height="34" rx="4" fill="#E20A17"/>
    <rect x="205" y="46" width="175" height="34" rx="4" fill="#E20A17"/>

    <!-- Middle upper left bars -->
    <rect x="20" y="96" width="135" height="30" rx="4" fill="#E20A17"/>
    <rect x="20" y="138" width="135" height="30" rx="4" fill="#E20A17"/>

    <!-- Middle upper right bars -->
    <rect x="225" y="96" width="135" height="30" rx="4" fill="#E20A17"/>
    <rect x="225" y="138" width="135" height="30" rx="4" fill="#E20A17"/>

    <!-- Vertical R letter -->
    <text x="190" y="124" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#E20A17" text-anchor="middle">R</text>

    <!-- Center horizontal bar - R - E - I - (Pure transparent inner fill) -->
    <rect x="20" y="180" width="340" height="50" rx="4" fill="none" stroke="#E20A17" stroke-width="4"/>
    <text x="190" y="215" font-family="'Courier New', Courier, monospace" font-weight="900" font-size="26" fill="#E20A17" text-anchor="middle" letter-spacing="4">- R - E - I -</text>

    <!-- Vertical I letter -->
    <text x="190" y="262" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#E20A17" text-anchor="middle">I</text>

    <!-- Middle lower left bars -->
    <rect x="20" y="238" width="135" height="30" rx="4" fill="#E20A17"/>
    <rect x="20" y="280" width="135" height="30" rx="4" fill="#E20A17"/>

    <!-- Middle lower right bars -->
    <rect x="225" y="238" width="135" height="30" rx="4" fill="#E20A17"/>
    <rect x="225" y="280" width="135" height="30" rx="4" fill="#E20A17"/>

    <!-- Bottom left horizontal bars -->
    <rect x="0" y="330" width="175" height="34" rx="4" fill="#E20A17"/>
    <rect x="0" y="376" width="175" height="34" rx="4" fill="#E20A17"/>

    <!-- Bottom right horizontal bars -->
    <rect x="205" y="330" width="175" height="34" rx="4" fill="#E20A17"/>
    <rect x="205" y="376" width="175" height="34" rx="4" fill="#E20A17"/>

    <!-- Since 1998 Banner -->
    <rect x="0" y="426" width="380" height="48" rx="6" fill="#E20A17"/>
    <text x="190" y="460" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">Since 1998</text>
  </g>
</svg>
